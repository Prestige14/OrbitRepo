[package]
name = "risk_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.8.4"
alloy-primitives = { version = "=0.8.20", features = ["tiny-keccak"] }
alloy-sol-types = "=0.8.20"
alloy-rlp = "=0.3.12"

[dev-dependencies]
stylus-sdk = { version = "0.8.4", features = ["stylus-test"] }

[build-dependencies]
alloy-primitives = { version = "=0.8.20", features = ["tiny-keccak"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
